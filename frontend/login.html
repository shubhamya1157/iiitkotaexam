<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | IIIT Kota Exam Platform</title>
    <link rel="stylesheet" href="./css/index.css">
</head>
<body>
    <main class="auth-card">
        <h1>Log in</h1>
        <p>Use your registered email and password to continue.</p>
        <p id="login-error" class="message error" role="alert" hidden></p>

        <form action="../backend/login.php" method="post">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required>

            <button type="submit">Log in</button>
        </form>
        <a class="back-link" href="index.html">Back to home</a>
    </main>
    <script>
        const messages = {
            invalid: 'The email or password is incorrect.',
            unavailable: 'Login is temporarily unavailable. Please try again later.',
        };
        const error = new URLSearchParams(window.location.search).get('error');
        const errorMessage = document.getElementById('login-error');
        if (Object.hasOwn(messages, error)) {
            errorMessage.textContent = messages[error];
            errorMessage.hidden = false;
        }
    </script>
</body>
</html>
